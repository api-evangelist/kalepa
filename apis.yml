name: Kalepa
kind: company
description: >-
  Kalepa is a New York–headquartered insurtech founded in 2018 by Paul
  Monasterio and Daniel Hillman that builds Copilot, an AI underwriting workbench
  sold to commercial property and casualty carriers, MGAs, mutuals and brokers in
  its home market of the United States. Copilot covers the commercial underwriting
  workflow end to end — submission ingestion out of broker email and document
  packages (ACORD forms, statements of value, loss runs, supplemental applications),
  clearance and sanctions screening, triage by bindability and profitability, risk
  analysis, rating, quote and bind document generation, and portfolio management.
  Its API posture is partner-gated and there is no public API. Kalepa publishes no
  developer portal — developer.kalepa.com, developers.kalepa.com and docs.kalepa.com
  do not resolve, and /developers, /api, /developer, /partners and /integrations on
  kalepa.com all return 404. A production API host does exist at api.kalepa.com and
  a "Kalepa API" component is monitored on the company status page, but every
  documentation path on it returns 404 and the application at copilot.kalepa.com
  redirects to api.kalepa.com/auth/login, so the only integration surface is behind
  a customer login negotiated in a commercial deal. The only technical posture Kalepa
  publishes sits on its For IT/AI Leaders page — an "API-first platform" claim, a 4-6
  week production deployment, and SOC 2 Type II, the single certification named
  anywhere on the site. Its open source is real but unrelated to the product API: two
  PyPI packages (safe-init, marshmallow-fastoneofschema) and 24 Terraform modules in
  the public HashiCorp registry, all infrastructure tooling rather than client SDKs.
  ACORD appears only as an ingested
  document format, not as an implemented data standard — no ACORD XML, AL3, NGDS,
  IVANS download, Applied Epic or Vertafore integration is documented anywhere on
  the public site. Kalepa is a clean example of the US insurance seam: no federal
  regulator, no open-insurance mandate, and therefore nothing forcing a vendor in
  the underwriting layer to expose anything publicly.
