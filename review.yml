conclusion: |
  Kalepa is recorded as an honest stub. It is a US insurtech operating in the
  underwriting layer with a real, production, operationally-monitored API that is
  entirely partner-gated and undocumented publicly. There is no developer portal, no
  downloadable specification, no webhooks, no Postman collection, no GraphQL or gRPC
  surface, and no published auth scheme. ACORD is consumed as a document format
  rather than implemented as a data standard, and no IVANS or agency-management-system
  integration is claimed. This is exactly what the US market seam predicts: with no
  federal insurance regulator and no open-insurance mandate, nothing forces the
  software layer between carriers and distribution to expose anything, and Kalepa
  does not.
