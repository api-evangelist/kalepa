aid: kalepa
name: Kalepa
review:
  question: Does Kalepa expose a public, self-serve developer portal or downloadable
    API specification for its Copilot underwriting platform?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  gated: true
findings:
  summary: |
    Kalepa publishes no public API surface. Every conventional developer-portal
    hostname was probed and none resolves: developer.kalepa.com, developers.kalepa.com,
    docs.kalepa.com, help.kalepa.com and support.kalepa.com all fail DNS/TLS (curl
    exit 000). Every conventional developer path on the marketing site returns 404:
    /developers, /api, /developer, /partners, /integrations, /docs and /platform.
    kalepa.readme.io returns 404. kalepa.stoplight.io returns 200 but serves the
    generic Stoplight wildcard landing page, not a Kalepa workspace.

    A real production API host DOES exist. api.kalepa.com resolves and answers, and
    the company status page at status.kalepa.com monitors exactly two components,
    "Kalepa Web App" and "Kalepa API". But api.kalepa.com/ returns 404, and so do
    /docs, /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /v1/openapi.json,
    /redoc, /health and /docs/openapi.json. The Copilot application at
    copilot.kalepa.com issues a 307 to
    https://api.kalepa.com/auth/login?frontend_redirect_url=... — a customer login
    wall. That is the entire integration surface: an authenticated, commercially
    negotiated customer API with no public reference documentation.

    Marketing does claim API integration. The carriers solution page states verbatim
    "Kalepa integrates via API with existing policy, underwriting, and document
    platforms", and the submission-ingestion page states "Whether via email
    auto-forwarding, portal integrations, or APIs, Kalepa automatically ingests,
    classifies, and extracts submission data from multi-document submission packages
    in minutes." No endpoint, base URL, auth scheme, scope, schema or named vendor
    integration is published to substantiate either claim. Because nothing is
    documented, apis[] in apis.yml is deliberately EMPTY — recording the absence is
    the accurate outcome, not a gap in the research.

    Kalepa's GitHub organization (https://github.com/Kalepa, 29 public repos) is real
    but contains only infrastructure open source — ~25 Terraform modules plus
    safe-init (AWS Lambda observability), kalepa-signxml and
    marshmallow-fastoneofschema. No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, .proto
    or Postman collection is published there or anywhere else.
  developerPortal:
    url: ''
    confirmed: false
    classification: none
    note: No developer portal of any kind exists — not a real portal, not a partner
      login wall branded as one, not even a marketing "innovation"/developer page.
      The nearest thing is the Copilot customer application login at
      copilot.kalepa.com, which is the product itself, not a developer surface.
