    note: No RSS/Atom feed found at any conventional path (/blog/feed.xml,
      /blog/rss.xml, /rss.xml, /feed.xml all 404).
  - url: https://github.com/Kalepa
    status: 200
    note: Real GitHub organization, 29 public repos, all infrastructure/Terraform
      open source. No API specifications of any kind.
  acordPosture:
    phrase: ACORD forms ingested as documents only; no ACORD XML, AL3, NGDS or IVANS
      integration documented
    evidence: |
      ACORD appears on kalepa.com exclusively as a document TYPE the AI extracts
      from, never as a data standard Kalepa implements or is certified against. The
      submission-ingestion page states verbatim: "Kalepa handles the full spectrum of
      submission documents, from standard ACORD forms to messy spreadsheets,
      handwritten notes, and complex loss runs." The homepage similarly lists
      "ACORDs and SOVs to complex loss runs and supplemental applications". Site-wide
      searches for AL3, ACORD XML, "ACORD certified", NGDS, IVANS, agency download,
      Applied Epic and Vertafore AMS360 returned no hits. This is the inverse of the
      classic US carrier posture: rather than moving ACORD as a structured EDI
      payload over IVANS agency download, Kalepa treats the ACORD form as
      unstructured input to be parsed by an LLM — which is itself the finding.
    certified: false
    al3: false
    acordXml: false
    ngds: false
    ivans: false
  insuranceVerbs:
    quote:
      exposedAsApi: false
      note: Copilot has a Rating module and a Quote & Bind module in the product UI
        that generate decision-ready documents, but neither is exposed as a
        documented public API endpoint.
    bind:
      exposedAsApi: false
      note: Product-surface only (Quote & Bind module). No documented API.
    issue:
      exposedAsApi: false
      note: Not a Kalepa function — policy issuance stays in the carrier's policy
        administration system.
    fnol:
      exposedAsApi: false
      note: Kalepa is an underwriting-side platform. No claims/FNOL product or API.
    audience: partner-only
    note: Kalepa sells to carriers, MGAs, mutuals and brokers. Every surface is
      agent/underwriter-facing inside a licensed customer tenant. Nothing is
      consumer-facing and nothing is self-serve.
  authModel:
    scheme: session login to customer tenant (undocumented)
    evidence: copilot.kalepa.com 307-redirects to api.kalepa.com/auth/login with a
      frontend_redirect_url parameter. No OIDC discovery document and no OAuth
      authorization-server metadata are served at either host (both 404). No API-key,
      OAuth2, mTLS or SAML scheme is documented publicly.
    publiclyDocumented: false
  webhooks:
    documented: false
    asyncapi: false
    note: No event catalog, webhook reference or AsyncAPI document is published.
      Absence is the finding — consistent with the sector.
  postman:
    publicCollection: false
    workspace: ''
  graphql:
    surfaceFound: false
  grpc:
    protoPublished: false
  openapi:
    harvested: false
    count: 0
    note: No OpenAPI or Swagger document was found at any probed path, on any host,
      or in the GitHub organization. The openapi/ directory is deliberately omitted
      from this repo because nothing real was found to save.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.kalepa.com
    documented: false
    note: Host confirmed live and monitored as "Kalepa API" on the public status
      page, but no path, schema or reference documentation is published. Gated
      behind customer login.
  - protocol: Email
    scheme: smtp
    documented: true
    note: Submission ingestion by email auto-forwarding is the primary documented
      integration channel — a forms/documents idiom, not an API idiom.
  - protocol: WebSocket
    scheme: wss
    documented: false
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
